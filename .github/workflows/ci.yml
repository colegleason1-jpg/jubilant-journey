name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: engine (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22.6+ strips types natively, so there is nothing to install or build.
          node-version: "22"
      - run: node --test "test/*.test.ts"
        working-directory: packages/core

  scout:
    name: scout (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: services/scout

      - name: End-to-end replay (no credentials)
        run: python -m scout.main --replay
        working-directory: services/scout
